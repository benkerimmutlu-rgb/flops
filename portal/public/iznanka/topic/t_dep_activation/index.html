l"><div class="screen screen--anim"><div class="appbar"><button class="iconbtn" aria-label="Назад"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><span class="appbar__title overline">Тема <!-- -->2<!-- --> · <!-- -->Депрессия: топливо и тормоза</span><span class="appbar__end caption">1<!-- --> / 3</span></div><h1 class="title-md">Поведенческая активация: действие раньше мотивации</h1><div class="tabs" role="tablist"><button class="tab label-sm" role="tab" aria-selected="true">Быстрый старт</button><button class="tab label-sm" role="tab" aria-selected="false">Теория</button><button class="tab label-sm" role="tab" aria-selected="false">В кабинете</button></div><div class="swipe"><div class="swipe__card" style="transform:translateX(0px) rotate(0deg);opacity:1"><span class="swipe__count overline">Карточка <!-- -->1<!-- --> из <!-- -->3</span><h2 class="title-lg">Сначала руки, потом желание</h2><p class="swipe__body reading">При депрессии мотивация приходит ПОСЛЕ действия, а не до. Ждать «захочется» — ловушка.</p><div class="swipe__foot"><div class="dots" role="tablist" aria-label="Карточки"><button class="dot" aria-current="true" aria-label="Карточка 1"></button><button class="dot" aria-current="false" aria-label="Карточка 2"></button><button class="dot" aria-current="false" aria-label="Карточка 3"></button></div><div class="row" style="gap:var(--space-2)"><button class="iconbtn iconbtn--neon iconbtn--glow" aria-label="Дальше"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></div></div></div></div></div></div><div class="phone__home"></div></div></div><script src="/iznanka/_next/static/chunks/webpack-27ded80f7edf4c66.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/iznanka/_next/static/media/48e2044251ef3125-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n2:HL[\"/iznanka/_next/static/media/904be59b21bd51cb-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n3:HL[\"/iznanka/_next/static/css/bfb16984aaed030b.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"4:I[2846,[],\"\"]\n6:I[643,[\"777\",\"static/chunks/777-018efff5badf7c9e.js\",\"823\",\"static/chunks/823-1c4b8b677ea0b949.js\",\"682\",\"static/chunks/app/topic/%5BtopicId%5D/page-95eda6dd279dab53.js\"],\"TopicView\"]\n10:I[4707,[],\"\"]\n12:I[6423,[],\"\"]\n13:I[823,[\"777\",\"static/chunks/777-018efff5badf7c9e.js\",\"823\",\"static/chunks/823-1c4b8b677ea0b949.js\",\"185\",\"static/chunks/app/layout-c202ee3aad5c923d.js\"],\"ProgressProvider\"]\n14:I[2972,[\"972\",\"static/chunks/972-60c5cd00c55aeeb5.js\",\"160\",\"static/chunks/app/not-found-1080262993c4216e.js\"],\"\"]\n16:I[1060,[],\"\"]\n8:[\"Сначала руки, потом желание: При депрессии мотивация приходит ПОСЛЕ действия, а не до. Ждать «захочется» — ловушка.\",\"Воронка избегания: «Нет сил» → лежу → меньше радости и смысла → ещё меньше сил. Активация разворачивает воронку.\",\"Маленькие шаги: Не «вернуть прежнюю жизнь», а одно конкретное посильное действие с опорой на ценности.\"]\n9:{\"psychoeducation\":\"Мотивация — это не стартер, а результат. Мы не будем ждать, пока «захочется». Выберем одно крошечное действие, которое вам немного важно, и посмотрим, что станет с настроением после.\",\"mistake\":\"Ставить слишком большие цели («начни бегать по утрам»). Провал усилит чувство несостоятельности.\",\"red_flags\":\"Полное самозанемогание, выраженная психомоторная заторможенность или суицидальные мысли — нужна оценка риска и психиатр.\"}\nb:{\"term\":\"Поведенческая активация\",\"definition\":\"Планирование "])</script><script>self.__next_f.push([1,"посильных действий для возврата активности и настроения.\"}\nc:{\"term\":\"Избегание\",\"definition\":\"Уход от активности: краткосрочно облегчает, в долгую усугубляет депрессию.\"}\na:[\"$b\",\"$c\"]\ne:{\"source\":\"Jacobson, Martell, Dimidjian — Behavioral Activation\",\"note\":\"Доказательная база метода.\"}\nf:{\"source\":\"NICE NG222 — психологические вмешательства\",\"note\":\"BA как метод первой линии.\"}\nd:[\"$e\",\"$f\"]\n7:{\"id\":\"t_dep_activation\",\"title\":\"Поведенческая активация: действие раньше мотивации\",\"cards\":\"$8\",\"longread\":\"Поведенческая активация (BA) — доказательный метод при депрессии. Логика: депрессия запускает избегание и уход от активности, человек лишается источников удовольствия и достижения, и настроение падает ещё сильнее. BA меняет порядок: не ждать мотивации, а планировать небольшие действия, связанные с удовольствием (pleasure) и мастерством (mastery), и отслеживать настроение до и после. Действие постепенно возвращает «заряд». Ключ — градуированность и привязка к ценностям клиента, а не к «надо».\",\"practice\":\"$9\",\"glossary\":\"$a\",\"references\":\"$d\"}\n11:[\"topicId\",\"t_dep_activation\",\"d\"]\n17:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"l3qJzmzg_Z34i9Mi7JeCi\",\"assetPrefix\":\"/iznanka\",\"urlParts\":[\"\",\"topic\",\"t_dep_activation\",\"\"],\"initialTree\":[\"\",{\"children\":[\"topic\",{\"children\":[[\"topicId\",\"t_dep_activation\",\"d\"],{\"children\":[\"__PAGE__?{\\\"topicId\\\":\\\"t_dep_activation\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"topic\",{\"children\":[[\"topicId\",\"t_dep_activation\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[\"$\",\"div\",null,{\"className\":\"stage\",\"children\":[\"$\",\"div\",null,{\"className\":\"phone\",\"children\":[[\"$\",\"div\",null,{\"className\":\"phone__status\",\"children\":[[\"$\",\"span\",null,{\"className\":\"label-sm\",\"children\":\"9:41\"}],[\"$\",\"span\",null,{\"className\":\"phone__island\"}],[\"$\",\"span\",null,{\"className\":\"phone__dots\",\"children\":[[\"$\",\"i\",null,{}],[\"$\",\"i\",null,{}],[\"$\",\"i\",null,{}]]}]]}],[\"$\",\"div\",null,{\"className\":\"phone__scroll\",\"children\":[\"$\",\"$L6\",null,{\"cluster\":{\"id\":\"c_depression\",\"title\":\"Депрессия: топливо и тормоза\",\"description\":\"Ангедония, руминации и поведенческая активация на языке нейромедиаторов.\",\"disclaimer\":\"Теория не заменяет супервизии. Депрессия — фактор суицидального риска: см. модуль «Оценка риска».\",\"avatar\":{\"name\":\"Максим, 40 лет\",\"case\":\"Руководитель отдела. Полгода как «выключился»: нет сил, ничего не радует, винит себя за лень.\"},\"topics\":[{\"id\":\"t_dep_neuro\",\"title\":\"Депрессия — это не лень\",\"cards\":[\"Сел аккумулятор: Депрессия бьёт по системе вознаграждения. Дело не в характере — мозг перестаёт выдавать «искру» от обычных радостей.\",\"Налог стресса: Хронический стресс и высокий кортизол истощают ресурсы мозга и тела. Воля — не кнопка, которую «просто не нажимают».\",\"Критик вместо тренера: Внутренний голос Максима не мотивирует, а бьёт. Самокритика — симптом депрессии, а не лекарство от неё.\"],\"longread\":\"Депрессия — это не слабость воли, а состояние, затрагивающее системы вознаграждения, стресс-реакцию и ритмы сна. Ангедония (утрата удовольствия) связана со сбоем дофаминовой системы вознаграждения: привычные стимулы перестают «зажигать». Хроническая активация оси стресса (ГГН-ось, высокий кортизол) и воспалительные процессы истощают ресурсы. Поэтому призыв «просто возьми себя в руки» не работает и усиливает вину. Важно: депрессия — значимый фактор суицидального риска, поэтому оценка риска обязательна.\",\"practice\":{\"psychoeducation\":\"Максим, представьте телефон с севшим аккумулятором. Он не ленивый — ему не хватает заряда. Ваша усталость и «ничего не хочется» — это не про характер, а про состояние, которое мы будем лечить.\",\"mistake\":\"Подкреплять самокритику клиента («да, надо собраться»). Это усиливает вину и снижает активность.\",\"red_flags\":\"Стойкая безнадёжность, мысли о смерти или суициде, резкая потеря веса, психотические симптомы — показания к оценке риска и консультации психиатра.\"},\"glossary\":[{\"term\":\"Ангедония\",\"definition\":\"Утрата способности получать удовольствие.\"},{\"term\":\"ГГН-ось\",\"definition\":\"Система стресс-реакции: гипоталамус — гипофиз — надпочечники.\"}],\"references\":[{\"source\":\"NICE NG222. Depression in adults (2022)\",\"note\":\"Клинические рекомендации по депрессии.\"},{\"source\":\"Beck A.T. — когнитивная модель депрессии\",\"note\":\"Негативная триада и роль самокритики.\"}],\"simulation\":{\"id\":\"sim_maxim_depression\",\"title\":\"Первая сессия с Максимом\",\"intro\":\"Максим пришёл по настоянию жены. Он уверен, что просто разленился. ЧЕРНОВИК: учебный сценарий, нужна вычитка эксперта.\",\"start\":\"m1\",\"outro\":\"Симуляция завершена. Помните про оценку риска и про темп клиента.\",\"nodes\":[{\"id\":\"m1\",\"client\":\"Честно, я не понимаю, зачем я здесь. Просто разленился и раскис. Нормальные люди справляются сами.\",\"options\":[{\"text\":\"То, что вы описываете, очень похоже на депрессию — это состояние, а не лень. Давайте посмотрим, как оно устроено.\",\"quality\":\"good\",\"feedback\":\"Снимает вину, вводит рамку состояния вместо характера. Снижает сопротивление.\",\"next\":\"m2\"},{\"text\":\"Ну, определённая доля дисциплины действительно помогла бы.\",\"quality\":\"poor\",\"feedback\":\"Подкрепляет самокритику и миф о «лени». Альянс и надежда страдают.\",\"next\":\"m1b\"},{\"text\":\"Расскажите, что именно изменилось за последние месяцы?\",\"quality\":\"ok\",\"feedback\":\"Разумный сбор анамнеза, но пока без нормализации — клиент всё ещё винит себя.\",\"next\":\"m2\"}]},{\"id\":\"m1b\",\"client\":\"Вот и вы туда же. Значит, со мной правда что-то не так, раз я не могу просто взять и собраться.\",\"options\":[{\"text\":\"Простите, я неудачно сказал. Дело не в дисциплине: похоже, вам сейчас по-настоящему тяжело, и это не ваша вина.\",\"quality\":\"good\",\"feedback\":\"Ремонт разрыва альянса: признать, скорректировать, валидировать.\",\"next\":\"m2\"},{\"text\":\"Я просто имел в виду, что надо стараться.\",\"quality\":\"poor\",\"feedback\":\"Разрыв не отремонтирован, клиент укрепляется в самокритике.\",\"next\":\"m3\"}]},{\"id\":\"m2\",\"client\":\"Допустим. Но я реально ничего не хочу — даже то, что раньше любил. Это вообще лечится?\",\"options\":[{\"text\":\"Да. То, что радость «выключилась», — это ангедония, частый симптом. Мы будем возвращать активность маленькими шагами, не дожидаясь, пока «захочется».\",\"quality\":\"good\",\"feedback\":\"Психообразование + вселение надежды + анонс поведенческой активации.\",\"next\":\"m3\"},{\"text\":\"Попробуйте просто заставить себя заниматься любимыми делами.\",\"quality\":\"poor\",\"feedback\":\"«Заставить себя» при ангедонии усиливает ощущение провала.\",\"next\":\"m3\"}]},{\"id\":\"m3\",\"client\":\"Хорошо. С чего мне тогда начать на этой неделе?\",\"options\":[{\"text\":\"Выберем одно маленькое посильное действие, связанное с тем, что вам важно, и отследим настроение до и после.\",\"quality\":\"good\",\"feedback\":\"Градуированная поведенческая активация с опорой на ценности — верный первый шаг.\",\"next\":null},{\"text\":\"Составьте большой план и вернитесь к прежнему ритму жизни.\",\"quality\":\"poor\",\"feedback\":\"Слишком амбициозно: риск провала и усиления вины.\",\"next\":null}]}]}},{\"id\":\"t_dep_activation\",\"title\":\"Поведенческая активация: действие раньше мотивации\",\"cards\":[\"Сначала руки, потом желание: При депрессии мотивация приходит ПОСЛЕ действия, а не до. Ждать «захочется» — ловушка.\",\"Воронка избегания: «Нет сил» → лежу → меньше радости и смысла → ещё меньше сил. Активация разворачивает воронку.\",\"Маленькие шаги: Не «вернуть прежнюю жизнь», а одно конкретное посильное действие с опорой на ценности.\"],\"longread\":\"Поведенческая активация (BA) — доказательный метод при депрессии. Логика: депрессия запускает избегание и уход от активности, человек лишается источников удовольствия и достижения, и настроение падает ещё сильнее. BA меняет порядок: не ждать мотивации, а планировать небольшие действия, связанные с удовольствием (pleasure) и мастерством (mastery), и отслеживать настроение до и после. Действие постепенно возвращает «заряд». Ключ — градуированность и привязка к ценностям клиента, а не к «надо».\",\"practice\":{\"psychoeducation\":\"Мотивация — это не стартер, а результат. Мы не будем ждать, пока «захочется». Выберем одно крошечное действие, которое вам немного важно, и посмотрим, что станет с настроением после.\",\"mistake\":\"Ставить слишком большие цели («начни бегать по утрам»). Провал усилит чувство несостоятельности.\",\"red_flags\":\"Полное самозанемогание, выраженная психомоторная заторможенность или суицидальные мысли — нужна оценка риска и психиатр.\"},\"glossary\":[{\"term\":\"Поведенческая активация\",\"definition\":\"Планирование посильных действий для возврата активности и настроения.\"},{\"term\":\"Избегание\",\"definition\":\"Уход от активности: краткосрочно облегчает, в долгую усугубляет депрессию.\"}],\"references\":[{\"source\":\"Jacobson, Martell, Dimidjian — Behavioral Activation\",\"note\":\"Доказательная база метода.\"},{\"source\":\"NICE NG222 — психологические вмешательства\",\"note\":\"BA как метод первой линии.\"}]},{\"id\":\"t_dep_rumination\",\"title\":\"Руминации: мысленная жвачка\",\"cards\":[\"Жвачка без вкуса: Руминация — бесконечное «почему я такой» без движения к решению. Ощущается как анализ, работает как яма.\",\"Не о чём, а как: Важно не содержание мыслей, а сам процесс застревания. Цель — заметить и сменить режим, а не «передумать правильно».\",\"Внимание как мышца: Возврат внимания к действию и телу — навык, который тренируется, а не разовое усилие.\"],\"longread\":\"Руминация — это повторяющееся негативное мышление (RNT), сфокусированное на причинах и последствиях плохого состояния. Она поддерживает и углубляет депрессию, усиливает безнадёжность и мешает решать проблемы. В отличие от продуктивной рефлексии, руминация не ведёт к действию. Подходы (rumination-focused CBT, элементы осознанности) учат распознавать режим руминации, смещать внимание на текущую деятельность и отличать абстрактное «почему» от конкретного «как».\",\"practice\":{\"psychoeducation\":\"Иногда ум как заевшая пластинка: кажется, что вы думаете над проблемой, но на деле ходите по кругу. Будем учиться замечать этот круг раньше и мягко выходить в действие, а не углубляться.\",\"mistake\":\"Пытаться «переспорить» каждую руминативную мысль по содержанию — это кормит процесс. Работаем с режимом, а не с каждым аргументом.\",\"red_flags\":\"Руминации с темой безнадёжности, вины и суицидального содержания — повод для оценки риска.\"},\"glossary\":[{\"term\":\"Руминация\",\"definition\":\"Повторяющееся «пережёвывание» мыслей без движения к решению.\"},{\"term\":\"RNT\",\"definition\":\"Repetitive negative thinking — повторяющееся негативное мышление.\"}],\"references\":[{\"source\":\"Nolen-Hoeksema S. — теория руминации\",\"note\":\"Руминация как фактор поддержания депрессии.\"},{\"source\":\"Watkins E. — Rumination-Focused CBT\",\"note\":\"Работа с режимом мышления.\"}]}],\"test\":{\"passScore\":4,\"questions\":[{\"id\":\"d_q_nature\",\"question\":\"Клиент винит себя за «лень». Какая реакция уместнее в начале?\",\"options\":[{\"text\":\"Нормализовать: это похоже на депрессию — состояние, а не лень.\",\"isCorrect\":true,\"feedback\":\"Снимает вину и снижает сопротивление.\"},{\"text\":\"Согласиться, что дисциплины действительно не хватает.\",\"isCorrect\":false,\"feedback\":\"Подкрепляет самокритику и миф о «лени».\"},{\"text\":\"Сразу дать домашнее задание на силу воли.\",\"isCorrect\":false,\"feedback\":\"Преждевременно и усиливает чувство провала.\"}]},{\"id\":\"d_q_ba_logic\",\"question\":\"В чём ключевая логика поведенческой активации?\",\"options\":[{\"text\":\"Действие раньше мотивации: не ждать «захочется», а планировать посильные шаги.\",\"isCorrect\":true,\"feedback\":\"Да: мотивация приходит после действия.\"},{\"text\":\"Сначала дождаться желания, потом действовать.\",\"isCorrect\":false,\"feedback\":\"Это и есть ловушка депрессии.\"},{\"text\":\"Загрузить себя делами по максимуму.\",\"isCorrect\":false,\"feedback\":\"Перегрузка ведёт к провалу; нужна градуированность.\"}]},{\"kind\":\"multi\",\"id\":\"d_q_depression_signs\",\"question\":\"Что относится к проявлениям депрессии?\",\"feedback\":\"Ангедония, упадок сил и самокритика — типичны. Повышенная энергичность и говорливость скорее указывают на иной полюс (мания/гипомания) и требуют отдельной оценки.\",\"options\":[{\"text\":\"Ангедония — утрата удовольствия.\",\"isCorrect\":true,\"feedback\":\"Ключевой симптом.\"},{\"text\":\"Упадок сил и утомляемость.\",\"isCorrect\":true,\"feedback\":\"Частый симптом.\"},{\"text\":\"Жёсткая самокритика и вина.\",\"isCorrect\":true,\"feedback\":\"Характерно для депрессии.\"},{\"text\":\"Повышенная энергичность и говорливость.\",\"isCorrect\":false,\"feedback\":\"Это ближе к (гипо)мании — нужна отдельная оценка.\"}]},{\"kind\":\"order\",\"id\":\"d_q_ba_order\",\"question\":\"Расставьте шаги поведенческой активации по порядку.\",\"feedback\":\"Сначала понять ценности и источники радости, затем выбрать маленькое действие, выполнить его и отследить настроение, потом постепенно расширять.\",\"items\":[\"Прояснить ценности и прежние источники радости.\",\"Выбрать одно маленькое посильное действие.\",\"Выполнить его и отметить настроение до и после.\",\"Постепенно расширять круг активности.\"]},{\"id\":\"d_q_risk\",\"question\":\"Клиент упоминает мысли «лучше бы меня не было». Ваши действия?\",\"options\":[{\"text\":\"Прямо и спокойно оценить суицидальный риск, не оставлять без внимания.\",\"isCorrect\":true,\"feedback\":\"Верно: риск оценивается прямо (см. модуль «Оценка риска»).\"},{\"text\":\"Сменить тему, чтобы не усиливать тяжёлые мысли.\",\"isCorrect\":false,\"feedback\":\"Избегание темы опасно; прямой вопрос не «внушает» мысли.\"},{\"text\":\"Успокоить, что это просто усталость, и продолжить план активации.\",\"isCorrect\":false,\"feedback\":\
