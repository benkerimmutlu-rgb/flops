"}]\n2:HL[\"/iznanka/_next/static/media/904be59b21bd51cb-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n3:HL[\"/iznanka/_next/static/css/bfb16984aaed030b.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"4:I[2846,[],\"\"]\n6:I[643,[\"777\",\"static/chunks/777-018efff5badf7c9e.js\",\"823\",\"static/chunks/823-1c4b8b677ea0b949.js\",\"682\",\"static/chunks/app/topic/%5BtopicId%5D/page-95eda6dd279dab53.js\"],\"TopicView\"]\n10:I[4707,[],\"\"]\n12:I[6423,[],\"\"]\n13:I[823,[\"777\",\"static/chunks/777-018efff5badf7c9e.js\",\"823\",\"static/chunks/823-1c4b8b677ea0b949.js\",\"185\",\"static/chunks/app/layout-c202ee3aad5c923d.js\"],\"ProgressProvider\"]\n14:I[2972,[\"972\",\"static/chunks/972-60c5cd00c55aeeb5.js\",\"160\",\"static/chunks/app/not-found-1080262993c4216e.js\"],\"\"]\n16:I[1060,[],\"\"]\n8:[\"Прошлое в настоящем: При ПТСР память о событии «не архивируется»: флешбэки, кошмары, вздрагивания — будто угроза сейчас.\",\"Три узла: Навязчивые переживания, избегание напоминаний и постоянная настороженность (гипербдительность).\",\"кПТСР: После длительной травмы добавляются трудности регуляции эмоций, негативный образ себя и проблемы в отношениях.\"]\n9:{\"psychoeducation\":\"При травме мозг иногда не успевает «разложить событие по полкам», и оно всплывает так, будто происходит сейчас. Это объяснимо и поддаётся работе. Мы будем двигаться бережно и в вашем темпе.\",\"mistake\":\"Трактовать избегание как «нежелание работать». Избегание — симптом, а не сопротивление.\",\"red_flags\":\"Суицидальный риск, самоповреждение, тяжёлая диссоциация, психотические симптомы, продолжающееся насилие — приоритет безопасности, оценка риска и психиатр.\"}\nb:{\"term"])</script><script>self.__next_f.push([1,"\":\"ПТСР\",\"definition\":\"Посттравматическое стрессовое расстройство.\"}\nc:{\"term\":\"Гипербдительность\",\"definition\":\"Постоянная настороженность и готовность к угрозе.\"}\na:[\"$b\",\"$c\"]\ne:{\"source\":\"МКБ-11 — ПТСР и комплексное ПТСР\",\"note\":\"Диагностические категории.\"}\nf:{\"source\":\"NICE NG116. PTSD (2018)\",\"note\":\"Травма-фокусированная КПТ и EMDR.\"}\nd:[\"$e\",\"$f\"]\n7:{\"id\":\"t_trauma_ptsd\",\"title\":\"ПТСР и кПТСР: когда прошлое не проходит\",\"cards\":\"$8\",\"longread\":\"ПТСР развивается у части людей после угрожающего события и включает навязчивые переживания (флешбэки, кошмары), избегание напоминаний, негативные изменения мыслей и настроения и гипервозбуждение (по DSM-5; в МКБ-11 ядро — повторное переживание, избегание, ощущение текущей угрозы). Комплексное ПТСР (кПТСР, МКБ-11) возникает после длительной повторяющейся травмы и добавляет нарушения аффективной регуляции, негативную самооценку и трудности в отношениях. Доказательные методы — травма-фокусированная КПТ, EMDR; им предшествует стабилизация. Работа с травмой требует подготовки и супервизии.\",\"practice\":\"$9\",\"glossary\":\"$a\",\"references\":\"$d\"}\n11:[\"topicId\",\"t_trauma_ptsd\",\"d\"]\n17:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"l3qJzmzg_Z34i9Mi7JeCi\",\"assetPrefix\":\"/iznanka\",\"urlParts\":[\"\",\"topic\",\"t_trauma_ptsd\",\"\"],\"initialTree\":[\"\",{\"children\":[\"topic\",{\"children\":[[\"topicId\",\"t_trauma_ptsd\",\"d\"],{\"children\":[\"__PAGE__?{\\\"topicId\\\":\\\"t_trauma_ptsd\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"topic\",{\"children\":[[\"topicId\",\"t_trauma_ptsd\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[\"$\",\"div\",null,{\"className\":\"stage\",\"children\":[\"$\",\"div\",null,{\"className\":\"phone\",\"children\":[[\"$\",\"div\",null,{\"className\":\"phone__status\",\"children\":[[\"$\",\"span\",null,{\"className\":\"label-sm\",\"children\":\"9:41\"}],[\"$\",\"span\",null,{\"className\":\"phone__island\"}],[\"$\",\"span\",null,{\"className\":\"phone__dots\",\"children\":[[\"$\",\"i\",null,{}],[\"$\",\"i\",null,{}],[\"$\",\"i\",null,{}]]}]]}],[\"$\",\"div\",null,{\"className\":\"phone__scroll\",\"children\":[\"$\",\"$L6\",null,{\"cluster\":{\"id\":\"c_trauma\",\"title\":\"Травма и нервная система\",\"description\":\"Гипервозбуждение, замирание и окно толерантности.\",\"disclaimer\":\"Теория не заменяет супервизии. Не проводите проработку травмы без подготовки; сначала стабилизация.\",\"avatar\":{\"name\":\"Ирина, 29 лет\",\"case\":\"Год назад попала в аварию. Вздрагивает от резких звуков, плохо спит, в стрессе «отключается» и застывает.\"},\"topics\":[{\"id\":\"t_trauma_window\",\"title\":\"Окно толерантности: газ и заморозка\",\"cards\":[\"Окно спокойствия: Есть зона, где нервная система справляется и можно думать и чувствовать. Это окно толерантности.\",\"Вылет вверх: Гипервозбуждение — «газ в пол»: паника, ярость, дрожь, невозможность усидеть.\",\"Вылет вниз: Гиповозбуждение — «заморозка»: оцепенение, отключение, пустота, ощущение «меня здесь нет».\"],\"longread\":\"Понятие окна толерантности (Siegel) описывает зону возбуждения, в которой человек способен выдерживать переживания, оставаясь в контакте и мышлении. При травме окно сужается: нервная система легко вылетает вверх (гипервозбуждение: тревога, паника, гнев) или вниз (гиповозбуждение: оцепенение, диссоциация, «замирание»). Это защитные реакции выживания, а не слабость. Задача терапии — сначала расширять окно и учить возвращаться в него (стабилизация), и лишь затем, при готовности, работать с самим травматическим материалом.\",\"practice\":{\"psychoeducation\":\"У нервной системы есть зона, где вам ок, и есть вылеты — в «слишком много» (паника, дрожь) и в «отключиться» (оцепенение). Это не поломка, а защита. Мы будем расширять эту зону и учиться в неё возвращаться.\",\"mistake\":\"Подробно расспрашивать о деталях травмы на первой встрече. Это может выбить из окна и ретравматизировать.\",\"red_flags\":\"Выраженная диссоциация, самоповреждение, суицидальные мысли, флешбэки с потерей контакта с реальностью — нужна оценка риска и профильный специалист.\"},\"glossary\":[{\"term\":\"Окно толерантности\",\"definition\":\"Зона возбуждения, в которой человек справляется и остаётся в контакте.\"},{\"term\":\"Диссоциация\",\"definition\":\"Защитное «отключение» от переживания, тела или реальности.\"}],\"references\":[{\"source\":\"Siegel D. — концепция окна толерантности\",\"note\":\"Рамка регуляции возбуждения.\"},{\"source\":\"NICE NG116. PTSD (2018)\",\"note\":\"Клинические рекомендации по ПТСР.\"}],\"simulation\":{\"id\":\"sim_irina_trauma\",\"title\":\"Первая сессия с Ириной\",\"intro\":\"Ирина пришла после года жизни «на нервах» после аварии. ЧЕРНОВИК: учебный сценарий, нужна вычитка эксперта.\",\"start\":\"t1\",\"outro\":\"Симуляция завершена. При травме стабилизация предшествует проработке; следите за окном толерантности и риском.\",\"nodes\":[{\"id\":\"t1\",\"client\":\"Можно я сразу расскажу, как всё было в тот день? Вроде надо же это проработать.\",\"options\":[{\"text\":\"Прежде чем идти в детали, давайте убедимся, что у вас есть опоры и способы вернуться в спокойствие. Так будет безопаснее.\",\"quality\":\"good\",\"feedback\":\"Стабилизация прежде проработки — защищает от ретравматизации.\",\"next\":\"t2\"},{\"text\":\"Да, конечно, расскажите максимально подробно всё, что помните.\",\"quality\":\"poor\",\"feedback\":\"Ранний подробный рассказ может выбить из окна толерантности и ретравматизировать.\",\"next\":\"t1b\"},{\"text\":\"А что вы сами чувствуете, когда думаете об этом сейчас?\",\"quality\":\"ok\",\"feedback\":\"Контакт с настоящим — неплохо, но следите, чтобы вопрос не запустил погружение.\",\"next\":\"t2\"}]},{\"id\":\"t1b\",\"client\":\"(бледнеет, говорит всё быстрее) ...и потом удар, и я не могла дышать, и всё как в тумане, я... мне нехорошо.\",\"options\":[{\"text\":\"Давайте сделаем паузу. Почувствуйте стопы на полу, посмотрите вокруг и назовите три предмета в комнате. Вы здесь, сейчас, в безопасности.\",\"quality\":\"good\",\"feedback\":\"Заземление и возврат в окно толерантности. Приоритет — регуляция.\",\"next\":\"t2\"},{\"text\":\"Продолжайте, вам важно выговориться до конца.\",\"quality\":\"poor\",\"feedback\":\"Игнорирование признаков вылета из окна усиливает ретравматизацию.\",\"next\":\"t3\"}]},{\"id\":\"t2\",\"client\":\"Иногда я будто выключаюсь и ничего не чувствую. Это ведь плохо, да? Со мной что-то не так?\",\"options\":[{\"text\":\"Это «выключение» — защитная реакция нервной системы, а не поломка. Мы научимся замечать её и мягко возвращаться в контакт.\",\"quality\":\"good\",\"feedback\":\"Нормализация диссоциации как защиты + анонс навыка.\",\"next\":\"t3\"},{\"text\":\"Да, это тревожный признак, так быть не должно.\",\"quality\":\"poor\",\"feedback\":\"Патологизация пугает и усиливает стыд.\",\"next\":\"t3\"}]},{\"id\":\"t3\",\"client\":\"Хорошо. С чего мы начнём, чтобы мне стало полегче?\",\"options\":[{\"text\":\"С навыков опоры и заземления, режима сна и ресурсов. К самой аварии перейдём, только когда вы будете готовы.\",\"quality\":\"good\",\"feedback\":\"Фаза стабилизации и ресурсов прежде травматической проработки — верный план.\",\"next\":null},{\"text\":\"Сразу начнём детально вспоминать аварию, чтобы быстрее отпустило.\",\"quality\":\"poor\",\"feedback\":\"Форсированная экспозиция без стабилизации рискованна.\",\"next\":null}]}]}},{\"id\":\"t_trauma_stabilization\",\"title\":\"Стабилизация прежде проработки\",\"cards\":[\"Фундамент раньше стен: Сначала безопасность, ресурсы и навыки регуляции — только потом работа с травматическим материалом.\",\"Якоря здесь-и-сейчас: Заземление (стопы, дыхание, 5 предметов) возвращает из прошлого в настоящее.\",\"Темп клиента: Скорость задаёт нервная система клиента, а не план терапевта. «Медленнее» часто значит «быстрее».\"],\"longread\":\"Фазовый подход к травме (Herman) выделяет этапы: 1) безопасность и стабилизация, 2) работа с воспоминаниями и переживанием, 3) восстановление связей и смысла. Пропуск первой фазы — частая и опасная ошибка: без ресурсов и навыков регуляции погружение в травму ретравматизирует. Стабилизация включает безопасность (в том числе бытовую), психообразование, навыки заземления и регуляции, восстановление сна и опор. Переход ко второй фазе — только при устойчивом расширении окна толерантности и согласии клиента.\",\"practice\":{\"psychoeducation\":\"Мы не будем бросаться в самое тяжёлое сразу. Сначала построим фундамент — навыки, которые помогут вам оставаться в безопасности и возвращаться в спокойствие. К трудному перейдём, когда опоры будут надёжными.\",\"mistake\":\"Торопить проработку «чтобы быстрее помогло». Форсирование ломает доверие и может навредить.\",\"red_flags\":\"Нестабильная безопасность (насилие, самоповреждение), тяжёлая диссоциация, суицидальный риск — проработка откладывается, подключается профильная помощь.\"},\"glossary\":[{\"term\":\"Фаза стабилизации\",\"definition\":\"Первый этап работы с травмой: безопасность, ресурсы, навыки регуляции.\"},{\"term\":\"Заземление\",\"definition\":\"Техники возврата внимания в настоящее и в тело.\"}],\"references\":[{\"source\":\"Herman J. — Trauma and Recovery\",\"note\":\"Трёхфазная модель восстановления.\"},{\"source\":\"ISTSS — рекомендации по лечению ПТСР\",\"note\":\"Фазовый подход и стабилизация.\"}]},{\"id\":\"t_trauma_ptsd\",\"title\":\"ПТСР и кПТСР: когда прошлое не проходит\",\"cards\":[\"Прошлое в настоящем: При ПТСР память о событии «не архивируется»: флешбэки, кошмары, вздрагивания — будто угроза сейчас.\",\"Три узла: Навязчивые переживания, избегание напоминаний и постоянная настороженность (гипербдительность).\",\"кПТСР: После длительной травмы добавляются трудности регуляции эмоций, негативный образ себя и проблемы в отношениях.\"],\"longread\":\"ПТСР развивается у части людей после угрожающего события и включает навязчивые переживания (флешбэки, кошмары), избегание напоминаний, негативные изменения мыслей и настроения и гипервозбуждение (по DSM-5; в МКБ-11 ядро — повторное переживание, избегание, ощущение текущей угрозы). Комплексное ПТСР (кПТСР, МКБ-11) возникает после длительной повторяющейся травмы и добавляет нарушения аффективной регуляции, негативную самооценку и трудности в отношениях. Доказательные методы — травма-фокусированная КПТ, EMDR; им предшествует стабилизация. Работа с травмой требует подготовки и супервизии.\",\"practice\":{\"psychoeducation\":\"При травме мозг иногда не успевает «разложить событие по полкам», и оно всплывает так, будто происходит сейчас. Это объяснимо и поддаётся работе. Мы будем двигаться бережно и в вашем темпе.\",\"mistake\":\"Трактовать избегание как «нежелание работать». Избегание — симптом, а не сопротивление.\",\"red_flags\":\"Суицидальный риск, самоповреждение, тяжёлая диссоциация, психотические симптомы, продолжающееся насилие — приоритет безопасности, оценка риска и психиатр.\"},\"glossary\":[{\"term\":\"ПТСР\",\"definition\":\"Посттравматическое стрессовое расстройство.\"},{\"term\":\"Гипербдительность\",\"definition\":\"Постоянная настороженность и готовность к угрозе.\"}],\"references\":[{\"source\":\"МКБ-11 — ПТСР и комплексное ПТСР\",\"note\":\"Диагностические категории.\"},{\"source\":\"NICE NG116. PTSD (2018)\",\"note\":\"Травма-фокусированная КПТ и EMDR.\"}]}],\"test\":{\"passScore\":4,\"questions\":[{\"id\":\"tr_q_window\",\"question\":\"Клиент в сессии начинает часто дышать, бледнеет и «уплывает». Что уместно?\",\"options\":[{\"text\":\"Остановиться и заземлить: стопы, взгляд по комнате, назвать предметы — вернуть в настоящее.\",\"isCorrect\":true,\"feedback\":\"Возврат в окно толерантности — приоритет.\"},{\"text\":\"Продолжить расспрос, чтобы «довести до конца».\",\"isCorrect\":false,\"feedback\":\"Это усиливает вылет из окна и ретравматизацию.\"},{\"text\":\"Сказать, что всё в порядке, и сменить тему без заземления.\",\"isCorrect\":false,\"feedback\":\"Обесценивание не возвращает регуляцию.\"}]},{\"id\":\"tr_q_phase\",\"question\":\"С чего начинается работа с травмой по фазовому подходу?\",\"options\":[{\"text\":\"С безопасности и стабилизации, навыков регуляции и ресурсов.\",\"isCorrect\":true,\"feedback\":\"Первая фаза — фундамент перед проработкой.\"},{\"text\":\"С подробного восстановления деталей события.\",\"isCorrect\":false,\"feedback\":\"Это вторая фаза; без стабилизации опасно.\"},{\"text\":\"С анализа детства клиента.\",\"isCorrect\":false,\"feedback\":\"Не приоритет на этапе стабилизации.\"}]},{\"kind\":\"multi\",\"id\":\"tr_q_ptsd_signs\",\"question\":\"Что относится к проявлениям ПТСР?\",\"feedback\":\"Флешбэки, избегание напоминаний и гипербдительность — ядро ПТСР. Полное отсутствие реакции на триггеры не характерно.\",\"options\":[{\"text\":\"Флешбэки и навязчивые воспоминания.\",\"isCorrect\":true,\"feedback\":\"Повторное переживание.\"},{\"text\":\"Избегание напоминаний о событии.\",\"isCorrect\":true,\"feedback\":\"Характерный узел.\"},{\"text\":\"Гипербдительность и вздрагивания.\",\"isCorrect\":true,\"feedback\":\"Ощущение текущей угрозы.\"},{\"text\":\"Полное безразличие к любым триггерам.\",\"isCorrect\":false,\"feedback\":\"Не характерно для ПТСР.\"}]},{\"kind\":\"order\",\"id\":\"tr_q_phase_order\",\"question\":\"Расставьте фазы работы с травмой по порядку.\",\"feedback\":\"Сначала безопасность и стабилизация, затем работа с воспоминаниями, в конце — восстановление связей и смысла.\",\"items\":[\"Безопасность и стабилизация, навыки регуляции.\",\"Работа с травматическими воспоминаниями.\",\"Восстановление связей, отношений и смысла.\"]},{\"id\":\"tr_q_avoidance\",\"question\":\"Клиент избегает разговоров о событии. Как это понимать?\",\"options\":[{\"text\":\"Как симптом травмы, с которым работают бережно, а не как сопротивление.\",\"isCorrect\":true,\"feedback\":\"Избегание — часть ПТСР, не «нежелание работать».\"},{\"text\":\"Как лень и нежелание меняться.\",\"isCorrect\":false,\"feedback\":\"Это обесценивает и вредит альянсу.\"},{\"text\":\"Как повод надавить и настоять на рассказе.\",\"isCorrect\":false,\"feedback\":\"Давление рискует ретравматизировать.\"}]}]}},\"topic\":\"$7\"}]}],[\"$\",\"div\",null,{\"className\":\"phone__home\"}]]}]}],null],null],null]},[null,[\"$\",\"$L10\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"topic\",\"children\",\"$11\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L12\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L10\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"topic\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L12\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/iznanka/_next/static/css/bfb16984aaed030b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"ru\",\"className\":\"__variable_bd1425\",\"children\":[\"$\",\"body\",null,{\"children\":[\"$\",\"$L13\",null,{\"children\":[\"$\",\"$L10\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L12\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[\"$\",\"div\",null,{\"className\":\"stage\",\"children\":[\"$\",\"div\",null,{\"className\":\"phone\",\"children\":[[\"$\",\"div\",null,{\"className\":\"phone__status\",\"children\":[[\"$\",\"span\",null,{\"className\":\"label-sm\",\"children\":\"9:41\"}],[\"$\",\"span\",null,{\"className\":\"phone__island\"}],[\"$\",\"span\",null,{\"className\":\"phone__dots\",\"children\":[[\"$\",\"i\",null,{}],[\"$\",\"i\",null,{}],[\"$\",\"i\",null,{}]]}]]}],[\"$\",\"div\",null,{\"className\":\"phone__scroll\",\"children\":[\"$\",\"div\",null,{\"className\"
